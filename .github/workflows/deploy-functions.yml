name: Deploy Supabase Edge Functions

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A CLI vem do npm, não de supabase/setup-cli: a action resolve a release
      # mais recente pela API do GitHub sem autenticação e falhava com
      # "rate limit exceeded".
      #
      # --use-api empacota no servidor. Sem isso a CLI baixa a imagem
      # public.ecr.aws/supabase/edge-runtime e o deploy quebrava com
      # "docker: toomanyrequests: Rate exceeded".
      #
      # Todas as functions vão num único comando: em matriz, cada job repetia a
      # instalação da CLI e multiplicava as chances de esbarrar em limites.
      - name: Deploy edge functions
        run: |
          npx --yes supabase@latest functions deploy \
            evolution-webhook \
            evolution-action \
            sync-whatsapp-history \
            sync-badges \
            send-scheduled \
            send-followup-sequences \
            send-cobranca \
            meta-sync \
            meta-action \
            meta-webhook \
            chatbot-engine \
            media-upload \
            --project-ref zexjmlthyxtunioojlga \
            --no-verify-jwt \
            --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
