name: Deploy Supabase Edge Functions

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function:
          - evolution-webhook
          - evolution-action
          - sync-whatsapp-history
          - sync-badges
          - send-scheduled
          - send-followup-sequences
          - send-cobranca
          - meta-sync
          - meta-action
          - meta-webhook
          - chatbot-engine
          - media-upload
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ matrix.function }}
        run: |
          supabase functions deploy ${{ matrix.function }} \
            --project-ref zexjmlthyxtunioojlga \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
