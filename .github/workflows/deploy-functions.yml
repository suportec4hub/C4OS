name: Deploy Supabase Edge Functions

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 12 jobs simultâneos esbarravam no limite de taxa do setup-cli
      max-parallel: 4
      matrix:
        function:
          - evolution-webhook
          - evolution-action
          - sync-whatsapp-history
          - sync-badges
          - send-scheduled
          - send-followup-sequences
          - send-cobranca
          - meta-sync
          - meta-action
          - meta-webhook
          - chatbot-engine
          - media-upload
    steps:
      - uses: actions/checkout@v4

      # Instalado via npm em vez de supabase/setup-cli: a action resolve a
      # release mais recente pela API do GitHub sem autenticação e falhava
      # intermitentemente com "rate limit exceeded".
      - name: Deploy ${{ matrix.function }}
        run: |
          npx --yes supabase@latest functions deploy ${{ matrix.function }} \
            --project-ref zexjmlthyxtunioojlga \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
